<!-- TODO
     fila            -> data-testid="item"
     lectura:  nombre-> data-testid="item-name"
               editar-> data-testid="edit-btn"
               borrar-> data-testid="delete-btn"
     edición:  input -> data-testid="edit-input"
               guardar-> data-testid="save-btn"
               cancelar-> data-testid="cancel-btn"
-->
<div data-testid="item" *ngFor="let person of people; index as i" >
     <ng-container *ngIf="editingIndex === i; else lectura">
          <input data-testid="edit-input" [(ngModel)]="draft">
          <button data-testid="save-btn" (click)="save()">Guardar</button>
          <button data-testid="cancel-btn" (click)="cancel()">Cancelar</button>
     </ng-container>
     <ng-template #lectura>
          <span data-testid="item-name">{{person}}</span>
          <button data-testid="edit-btn" (click)="startEdit(i)">Editar</button>
          <button data-testid="delete-btn" (click)="remove(i)">Borrar</button>
     </ng-template>
</div>
